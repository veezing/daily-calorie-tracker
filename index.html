            </div>

            {/* TAB 1: DASHBOARD ONLY METRICS */}
            {activeTab === 'dashboard' && (
              <div className="space-y-4 animate-in fade-in duration-300">
                {/* 2. SIX TELEMETRY CARDS */}
                <section className="grid grid-cols-2 lg:grid-cols-6 gap-3">
              {/* Daily Energy */}
              <div className="bg-slate-900 border border-slate-800 rounded-xl p-3.5">
                <div className="text-[11px] text-slate-400 uppercase">Day {viewedDayIndex} Energy</div>
                <div className="text-xl font-bold font-mono text-white mt-1">

                            <button onClick={() => setSelectedDbItem(null)} className="text-slate-500 hover:text-slate-300 cursor-pointer font-bold text-lg leading-none">&times;</button>
                          </div>
                        </div>

                        {selectedDbItem.mode === 'unit' && selectedDbItem.unitMassG && (
                          <div className="flex gap-2 text-[11px]">
                            <button
                              type="button"
                              onClick={() => { setInputMode('units'); setInputValue('1'); }}
                              className={`flex-1 py-1 rounded border cursor-pointer ${inputMode === 'units' ? 'bg-emerald-500/20 border-emerald-500/40 text-emerald-300 font-semibold' : 'bg-slate-900 border-slate-800 text-slate-400'}`}
                            >
                              By Units (1 pc = {selectedDbItem.kcal} kcal)
                            </button>
                            <button
                              type="button"
                              onClick={() => { setInputMode('mass'); setInputValue(String(selectedDbItem.unitMassG)); }}
                              className={`flex-1 py-1 rounded border cursor-pointer ${inputMode === 'mass' ? 'bg-emerald-500/20 border-emerald-500/40 text-emerald-300 font-semibold' : 'bg-slate-900 border-slate-800 text-slate-400'}`}
                            >
                              By Grams (~{selectedDbItem.unitMassG}g/unit)
                            </button>
                          </div>
                        )}

                        <div className="grid grid-cols-2 gap-2.5">
                          <div>
                            <label className="block text-[10px] text-slate-400 mb-1">
                              {selectedDbItem.mode === 'unit' && inputMode === 'units' ? 'Units / Pieces' : 'SF-400 Net Mass (g / ml)'}
                            </label>
                            <input
                              type="number" step="0.1" value={inputValue}
                              onChange={(e) => setInputValue(e.target.value)}
                              className="w-full bg-slate-900 border border-slate-700 rounded px-2.5 py-1.5 text-sm font-mono text-white"
                            />
                          </div>
                          <div>
                            <label className="block text-[10px] text-slate-400 mb-1">Note / Context</label>
                            <input
                              type="text" placeholder="e.g. 3 pcs or cooked" value={pieceNote}
                              onChange={(e) => setPieceNote(e.target.value)}
                              className="w-full bg-slate-900 border border-slate-700 rounded px-2.5 py-1.5 text-xs font-mono text-white"
                            />
                          </div>
                        </div>

                        <div className="grid grid-cols-4 gap-1.5 text-center font-mono text-xs">
                          <div className="bg-slate-900 p-1.5 rounded border border-slate-800"><div className="text-[10px] text-slate-400">KCAL</div><div className="font-bold text-amber-300">{scaledPreview.kcal.toFixed(1)}</div></div>
                          <div className="bg-slate-900 p-1.5 rounded border border-slate-800"><div className="text-[10px] text-slate-400">PROT</div><div className="font-bold text-sky-300">{scaledPreview.protein.toFixed(1)}g</div></div>
                          <div className="bg-slate-900 p-1.5 rounded border border-slate-800"><div className="text-[10px] text-slate-400">CARB</div><div className="font-bold text-emerald-300">{scaledPreview.carbs.toFixed(1)}g</div></div>
                          <div className="bg-slate-900 p-1.5 rounded border border-slate-800"><div className="text-[10px] text-slate-400">FAT</div><div className="font-bold text-rose-300">{scaledPreview.fat.toFixed(1)}g</div></div>
                        </div>

                        <div className="flex gap-2">
                          <button
                            type="button"
                            onClick={() => setSelectedDbItem(null)}
                            className="px-3 py-2 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-semibold cursor-pointer"
                          >
                            Cancel
                          </button>
                          <button
                            type="button"
                            onClick={handleAddFromScale}
                            className="flex-1 py-2 rounded-lg bg-emerald-600 hover:bg-emerald-500 text-white font-semibold text-xs cursor-pointer"
                          >
                            + Log to {activeMealWindows.find(w => w.id === selectedMealWindow)?.label || selectedMealWindow}
                          </button>
                        </div>
                      </div>
                    )}
                      </div>
                    )}
                  </div>

                  {/* PIPE-DELIMITED SHORTHAND TOOL */}
                  <div className="bg-slate-900 border border-slate-800 rounded-xl p-3.5 space-y-2.5">
                    <button
                      type="button"
                      onClick={() => setShowPipeDrawer(!showPipeDrawer)}
                      className="w-full flex items-center justify-between text-xs font-bold uppercase tracking-wider text-amber-300 hover:text-amber-200 cursor-pointer"
                    >
                      <span className="flex items-center gap-2">
                        <span>{showPipeDrawer ? '▼' : '▶'}</span>
                        <span>⚡ Rapid Pipe-Parser (|)</span>
                      </span>
                      <span className="text-[10px] font-mono text-slate-500">Fast Entry</span>
                    </button>

                    {showPipeDrawer && (
                      <div className="pt-2 border-t border-slate-800 space-y-2">
                        <p className="text-[11px] text-slate-400 font-mono">
                          Format: <code>Item | Qty | kcal | P | C | F</code>
                        </p>
                        <textarea
                          rows="4"
                          placeholder="Paste 1 or multiple lines:&#10;Boiled Egg | 2 pcs | 140 | 12 | 1 | 9.5&#10;Raw Paneer | 100g | 265 | 18.5 | 2.5 | 20.8"
                          value={pipeInputText}
                          onChange={(e) => setPipeInputText(e.target.value)}
                          className="w-full bg-slate-950 border border-slate-700 rounded-lg px-2.5 py-1.5 text-xs text-white font-mono resize-y"
                        />
                       <div className="grid grid-cols-3 gap-1.5 pt-1">
                          <button
                            type="button"
                            onClick={() => handleParseAndLogPipe('log_only')}
                            className="py-1.5 px-2 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-200 text-[11px] font-semibold border border-slate-700 cursor-pointer"
                          >
                            ⚡ Log Meal
                          </button>
                          <button
                            type="button"
                            onClick={() => handleParseAndLogPipe('db_only')}
                            className="py-1.5 px-2 rounded-lg bg-sky-600/20 hover:bg-sky-600/30 text-sky-300 text-[11px] font-semibold border border-sky-500/40 cursor-pointer"
                          >
                            + Save DB Only
                          </button>
                          <button
                            type="button"
                            onClick={() => handleParseAndLogPipe('log_and_db')}
                            className="py-1.5 px-2 rounded-lg bg-emerald-600 hover:bg-emerald-500 text-white text-[11px] font-semibold cursor-pointer"
                          >
                            ⚡ Log & Save DB
                          </button>
                        </div>
                      </div>
                    )}
                  </div>

                  {/* COLLAPSIBLE 4-4-9 EXTRAPOLATOR */}
                  <div className="bg-slate-900 border border-slate-800 rounded-xl p-3.5 space-y-2.5">
                    <button
                      type="button"
                      onClick={() => setShowCustomAdder(!showCustomAdder)}
                      className="w-full flex items-center justify-between text-xs font-bold uppercase tracking-wider text-sky-300 hover:text-sky-200 cursor-pointer"
                    >
                      <span className="flex items-center gap-2">
                        <span>{showCustomAdder ? '▼' : '▶'}</span>
                        <span>+ Add Unlisted Food (Auto-Extrapolator)</span>
                      </span>
                      <span className="text-[10px] font-mono text-slate-500">4-4-9</span>
                    </button>

                    {showCustomAdder && (
                      <div className="pt-2 border-t border-slate-800 space-y-2.5">
                        <div className="grid grid-cols-4 gap-2">
  <input
    type="text" placeholder="Row ID (e.g. HC-23)" value={customEntry.rowId}
    onChange={(e) => setCustomEntry({ ...customEntry, rowId: e.target.value })}
    className="w-full bg-slate-950 border border-slate-800 rounded-lg px-2.5 py-1.5 text-xs font-mono text-emerald-400"
  />
  <input
    type="text" placeholder="Food Name" value={customEntry.name}
    onChange={(e) => setCustomEntry({ ...customEntry, name: e.target.value })}
    className="col-span-2 bg-slate-950 border border-slate-800 rounded-lg px-2.5 py-1.5 text-xs text-white"
  />
                  <select
                            value={customEntry.category}
                            onChange={(e) => {
                              if (e.target.value === '__new__') {
                                const newCat = prompt('Enter new category name:');
                                if (newCat && newCat.trim()) setCustomEntry({ ...customEntry, category: newCat.trim() });
                              } else {
                                setCustomEntry({ ...customEntry, category: e.target.value });
                              }
                            }}
                            className="bg-slate-950 border border-slate-800 rounded-lg px-2 py-1.5 text-xs text-slate-300"
                          >
                            {DEFAULT_TAXONOMY.map(cat => <option key={cat} value={cat}>{cat}</option>)}
                            <option value="__new__">+ Create New Category...</option>
                          </select>
                        </div>

                        <div className="grid grid-cols-3 gap-2">
                          <div>
                            <label className="block text-[10px] text-slate-400 mb-1">Mode</label>
                            <select
                              value={customEntry.targetStorageMode}
                              onChange={(e) => {
                                const mode = e.target.value;
                                setCustomEntry(prev => ({
                                  ...prev,
                                  targetStorageMode: mode,
                                  sourceRefQty: mode === 'unit' ? '1.0' : '100.0',
                                  consumedNowQty: mode === 'unit' ? '1' : '100.0'
                                }));
                              }}
                              className="w-full bg-slate-950 border border-slate-800 rounded-lg px-2 py-1.5 text-xs text-white"
                            >
                              <option value="100g">Per 100g</option>
                              <option value="100ml">Per 100 ml</option>
                              <option value="unit">Per 1 Unit</option>
                            </select>
                          </div>

                          {!extrapolatedDbPreview.isUnitMode ? (
                            <div>
                              <label className="block text-[10px] text-slate-400 mb-1">Source Qty ({customEntry.targetStorageMode === '100ml' ? 'ml' : 'g'})</label>
                              <input
                                type="number" step="0.1" value={customEntry.sourceRefQty}
                                onChange={(e) => setCustomEntry({ ...customEntry, sourceRefQty: e.target.value })}
                                className="w-full bg-slate-950 border border-slate-700 rounded-lg px-2 py-1.5 text-xs font-mono text-amber-300"
                                title="Package/sample weight in grams or ml"
                              />
                            </div>
                          ) : (
                            <div>
                              <label className="block text-[10px] text-slate-400 mb-1">Ref Baseline</label>
                              <div className="w-full bg-slate-950/50 border border-slate-800 rounded-lg px-2 py-1.5 text-xs font-mono text-slate-400">
                                1 Piece / Unit
                              </div>
                            </div>
                          )}

                          <div>
                            <label className="block text-[10px] text-slate-400 mb-1">
                              {extrapolatedDbPreview.isUnitMode ? 'Units Eaten' : 'Grams Eaten'}
                            </label>
                            <input
                              type="number" step="0.1" value={customEntry.consumedNowQty}
                              onChange={(e) => setCustomEntry({ ...customEntry, consumedNowQty: e.target.value })}
                              className="w-full bg-slate-950 border border-slate-700 rounded-lg px-2 py-1.5 text-xs font-mono text-emerald-300"
                            />
                          </div>
                        </div>

                        <div className="flex items-center justify-between text-[10px] text-slate-400 pt-1">
                          <span>Macros for <strong>{extrapolatedDbPreview.isUnitMode ? '1 Unit' : `${customEntry.sourceRefQty || 100}${customEntry.targetStorageMode === '100ml' ? 'ml' : 'g'}`}</strong>:</span>
                          <button
                            type="button"
                            onClick={handleApplyAtwaterToCustom}
                            className="px-2 py-0.5 rounded bg-sky-500/15 text-sky-300 border border-sky-500/30 font-mono cursor-pointer"
                          >
                            ⚡ Calc 4-4-9 ({extrapolatedDbPreview.atwaterKcal} kcal)
                          </button>
                        </div>

                        {/* Consistent Order: kcal, Protein, Carbs, Fat */}
                        <div className="grid grid-cols-4 gap-1.5">
                          <div>
                            <label className="block text-[9px] font-mono text-slate-400 mb-0.5">kcal</label>
                            <input type="number" step="0.1" placeholder={String(extrapolatedDbPreview.atwaterKcal)} value={customEntry.kcal} onChange={(e) => setCustomEntry({ ...customEntry, kcal: e.target.value })} className="w-full bg-slate-950 border border-slate-800 rounded-lg px-2 py-1.5 text-xs font-mono text-amber-300" />
                          </div>
                          <div>
                            <label className="block text-[9px] font-mono text-slate-400 mb-0.5">Prot (g)</label>
                            <input type="number" step="0.1" placeholder="0" value={customEntry.protein} onChange={(e) => setCustomEntry({ ...customEntry, protein: e.target.value })} className="w-full bg-slate-950 border border-slate-800 rounded-lg px-2 py-1.5 text-xs font-mono text-sky-300" />
                          </div>
                          <div>
                            <label className="block text-[9px] font-mono text-slate-400 mb-0.5">Carb (g)</label>
                            <input type="number" step="0.1" placeholder="0" value={customEntry.carbs} onChange={(e) => setCustomEntry({ ...customEntry, carbs: e.target.value })} className="w-full bg-slate-950 border border-slate-800 rounded-lg px-2 py-1.5 text-xs font-mono text-emerald-300" />
                          </div>
                          <div>
                            <label className="block text-[9px] font-mono text-slate-400 mb-0.5">Fat (g)</label>
                            <input type="number" step="0.1" placeholder="0" value={customEntry.fat} onChange={(e) => setCustomEntry({ ...customEntry, fat: e.target.value })} className="w-full bg-slate-950 border border-slate-800 rounded-lg px-2 py-1.5 text-xs font-mono text-rose-300" />
                          </div>
                        </div>

                        <div className="bg-slate-950 border border-slate-800/80 rounded-lg p-2 text-[11px] font-mono text-slate-300 flex justify-between">
                          <span>Normalized DB Base:</span>
                          <span className="text-amber-300">{extrapolatedDbPreview.normKcal} kcal | {extrapolatedDbPreview.normP}P | {extrapolatedDbPreview.normC}C | {extrapolatedDbPreview.normF}F</span>
                        </div>

                        <div className="grid grid-cols-3 gap-1.5 pt-1">
                          <button
                            type="button"
                            onClick={() => handleLogCustomNow(false)}
                            className="py-2 px-2 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-200 text-[11px] font-semibold border border-slate-700 cursor-pointer"
                          >
                            + Log Meal Only
                          </button>
                          <button
                            type="button"
                            onClick={handleSaveCustomToMasterDbOnly}
                            className="py-2 px-2 rounded-lg bg-sky-600/20 hover:bg-sky-600/30 text-sky-300 text-[11px] font-semibold border border-sky-500/40 cursor-pointer"
                          >
                            + Save DB Only
                          </button>
                          <button
                            type="button"
                            onClick={() => handleLogCustomNow(true)}
                            className="py-2 px-2 rounded-lg bg-emerald-600 hover:bg-emerald-500 text-white text-[11px] font-semibold cursor-pointer"
                          >
                            + Log & Save DB
                          </button>
                        </div>
                      </div>
                    )}
                  </div>
		</div>
                )}

                {/* RIGHT COLUMN: ITEMIZED LOG (Adjusts width automatically based on tab) */}
                <div className={`${activeTab === 'studio' ? 'lg:col-span-7' : 'col-span-1 max-w-5xl mx-auto w-full'} min-w-0 bg-slate-900 border border-slate-800 rounded-xl overflow-hidden shadow-xl transition-all`}>
                  
                  {/* DASHBOARD QUICK ACTION DOCK */}
                  {activeTab === 'dashboard' && (
                    <div className="bg-emerald-950/20 border-b border-emerald-900/30 px-4 py-2.5 flex flex-wrap items-center justify-between gap-3">
                      <span className="text-xs text-emerald-400 font-mono">Day {viewedDayIndex} Locked View</span>
                      <button
                        type="button"
                        onClick={() => setActiveTab('studio')}
                        className="px-4 py-1.5 bg-emerald-600 hover:bg-emerald-500 text-white rounded-lg text-xs font-bold shadow-lg shadow-emerald-900/20 transition transform hover:scale-105 cursor-pointer"
                      >
                        ➕ Open Entry Studio
                      </button>
                    </div>
                  )}

                  <div className="px-4 py-3 border-b border-slate-800 flex flex-wrap items-center justify-between gap-2 bg-slate-900">
    <div>
      <span className="text-xs font-bold uppercase tracking-wider text-white">
        Day {viewedDayIndex} Itemized Log ({currentDayObj.items?.length || 0} items)
      </span>
      <p className="text-[11px] text-slate-400">
        Adjust <strong>Grams / Portions</strong> directly in the table to scale values on the fly.
      </p>
    </div>
  </div>

  <div className="overflow-x-auto">
    <table className="w-full text-left border-collapse text-xs table-fixed min-w-[340px]">
                      <thead>
                        <tr className="border-b border-slate-800 bg-slate-950 text-[10px] sm:text-[11px] text-slate-400 uppercase">
                          <th className="py-2 px-2 w-[34%] sm:w-[38%]">Item</th>
                          <th className="py-2 px-1 w-[18%] sm:w-[16%] text-center">Portion</th>
                          <th className="py-2 px-1.5 text-right w-[12%]">kcal</th>
                          <th className="py-2 px-1.5 text-right w-[11%]">P</th>
                          <th className="py-2 px-1.5 text-right w-[11%]">C</th>
                          <th className="py-2 px-1.5 text-right w-[11%]">F</th>
                          <th className="py-2 px-0.5 text-center w-[3%]"></th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-slate-800/50">
                        {activeMealWindows.map((mw) => {
                          const items = (currentDayObj.items || []).filter((i) => i.mealWindow === mw.id);
                          if (!items.length) return null;
                          const subKcal = items.reduce((s, i) => s + Number(i.kcal || 0), 0);
                          const subP = items.reduce((s, i) => s + Number(i.protein || 0), 0);
                          const subC = items.reduce((s, i) => s + Number(i.carbs || 0), 0);
                          const subF = items.reduce((s, i) => s + Number(i.fat || 0), 0);

                          return (
                            <React.Fragment key={mw.id}>
                              {/* 1. SPANNING MEAL WINDOW HEADER ROW */}
                              <tr className="bg-slate-950/80 border-t-2 border-slate-800">
                                <td colSpan={7} className="py-2 px-2.5">
                                  <div className="flex items-center justify-between gap-1 flex-wrap">
                                    <div className="flex items-center gap-1.5 min-w-0">
                                      <span className="text-emerald-400 font-bold text-xs truncate">
                                        🍽 {mw.label}
                                      </span>
                                      <button
                                        type="button"
                                        onClick={() => handleRenameMealWindow(mw.id, mw.label)}
                                        className="text-[11px] text-slate-400 hover:text-white px-1 py-0.5 rounded hover:bg-slate-800 cursor-pointer"
                                        title="Rename Window"
                                      >
                                        ✎
                                      </button>
                                      <button
                                        type="button"
                                        onClick={() => handleMoveMealWindow(mw.id, 'up')}
                                        className="text-[10px] text-slate-400 hover:text-white px-1 py-0.5 rounded hover:bg-slate-800 cursor-pointer"
                                        title="Move Earlier"
                                      >
                                        ▲
                                      </button>
                                      <button
                                        type="button"
                                        onClick={() => handleMoveMealWindow(mw.id, 'down')}
                                        className="text-[10px] text-slate-400 hover:text-white px-1 py-0.5 rounded hover:bg-slate-800 cursor-pointer"
                                        title="Move Later"
                                      >
                                        ▼
                                      </button>
                                    </div>
                                    <button
                                      type="button"
                                      onClick={() => handleSaveWindowAsPreset(mw.id, mw.label)}
                                      className="text-[10px] font-mono px-2 py-0.5 rounded bg-amber-500/15 text-amber-300 border border-amber-500/30 hover:bg-amber-500/25 cursor-pointer shrink-0"
                                    >
                                      ★ Save Preset
                                    </button>
                                  </div>
                                </td>
                              </tr>

                              {/* 2. ITEM ROWS */}
                              {items.map((item) => (
                                <tr key={item.id} className="hover:bg-slate-800/30">
                                  <td className="py-1.5 px-2.5 text-slate-100 align-middle">
                                    <div className="font-medium text-slate-200 leading-snug break-words">
                                      {item.name}
                                    </div>
                                    <div className="text-[10px] font-mono text-slate-400 truncate">
                                      {item.refUnit}
                                    </div>
                                  </td>
                                  <td className="py-1.5 px-1 text-center align-middle">
                                    <div className="inline-flex items-center justify-center gap-1">
                                      <input
                                        type="number"
                                        step={item.units !== undefined || (item.massG === null && !item.mode?.includes('100')) ? "1" : "0.5"}
                                        value={item._rawPortionInput !== undefined ? item._rawPortionInput : (item.units !== undefined ? item.units : (item.massG !== null ? item.massG : ''))}
                                        onChange={(e) => handleInlineRescaleItem(item.id, e.target.value)}
                                        className="w-14 sm:w-16 bg-slate-950 border border-slate-700 focus:border-emerald-500 rounded px-1 py-0.5 text-center text-xs font-mono text-emerald-300"
                                      />
                                      <span className="text-[10px] font-mono text-slate-400">
                                        {item.units !== undefined ? 'pc' : 'g'}
                                      </span>
                                    </div>
                                  </td>
                                  <td className="py-1.5 px-1 text-right font-mono text-amber-300 font-semibold align-middle">
                                    {item.kcal.toFixed(1)}
                                  </td>
                                  <td className="py-1.5 px-1 text-right font-mono text-sky-300 align-middle">
                                    {item.protein.toFixed(1)}
                                  </td>
                                  <td className="py-1.5 px-1 text-right font-mono text-emerald-300 align-middle">
                                    {item.carbs.toFixed(1)}
                                  </td>
                                  <td className="py-1.5 px-1 text-right font-mono text-rose-300 align-middle">
                                    {item.fat.toFixed(1)}
                                  </td>
                                  <td className="py-1.5 px-1 text-center align-middle">
                                    <button
                                      type="button"
                                      onClick={() => updateCurrentDay(b => ({ ...b, items: (b.items || []).filter(x => x.id !== item.id) }))}
                                      className="text-slate-500 hover:text-rose-400 px-1 cursor-pointer font-bold leading-none"
                                      title="Remove item"
                                    >
                                      ✕
                                    </button>
                                  </td>
                                </tr>
                              ))}

                              {/* 3. ALIGNED SUBTOTAL ROW */}
                              <tr className="bg-slate-950/60 border-t border-slate-800 text-[10px] font-mono text-slate-400">
                                <td colSpan={2} className="py-1 px-2 text-right font-medium italic text-slate-400 truncate">
                                  {mw.label} Subtotal:
                                </td>
                                <td className="py-1 px-1.5 text-right text-amber-300/90 font-semibold tabular-nums">{subKcal.toFixed(1)}</td>
                                <td className="py-1 px-1.5 text-right text-sky-300/90 font-semibold tabular-nums">{subP.toFixed(1)}</td>
                                <td className="py-1 px-1.5 text-right text-emerald-300/90 font-semibold tabular-nums">{subC.toFixed(1)}</td>
                                <td className="py-1 px-1.5 text-right text-rose-300/90 font-semibold tabular-nums">{subF.toFixed(1)}</td>
                                <td></td>
                              </tr>
                            </React.Fragment>
                          );
                        })}
                      </tbody>
                      <tfoot>
                        <tr className="bg-emerald-950/40 border-t-2 border-emerald-500/40 font-mono text-xs font-bold">
                          <td colSpan={2} className="py-2.5 px-2 text-emerald-300 truncate">Day {viewedDayIndex} Total</td>
                          <td className="py-2.5 px-1.5 text-right text-amber-300 tabular-nums">{dailyTotals.kcal.toFixed(1)}</td>
                          <td className="py-2.5 px-1.5 text-right text-sky-300 tabular-nums">{dailyTotals.protein.toFixed(1)}</td>
                          <td className="py-2.5 px-1.5 text-right text-emerald-300 tabular-nums">{dailyTotals.carbs.toFixed(1)}</td>
                          <td className="py-2.5 px-1.5 text-right text-rose-300 tabular-nums">{dailyTotals.fat.toFixed(1)}</td>
                          <td></td>
                        </tr>
                      </tfoot>
                    </table>
                  </div>
                </div>
              </div>
            )}

            {/* TAB 2: TRAILING HISTORY */}
            {activeTab === 'trailing' && (
              <div className="bg-slate-900 border border-slate-800 rounded-xl p-4 overflow-x-auto space-y-3">
                <div className="flex flex-wrap items-center justify-between gap-2">
                  <h3 className="text-xs font-bold uppercase tracking-wider text-white">
                    Trailing 7-Day Window Ending on Day {viewedDayIndex} (7d Weight Avg: {trailingMetrics.avgWeight7d ? `${trailingMetrics.avgWeight7d} kg` : '—'})
                  </h3>
                </div>
                <table className="w-full text-left border-collapse text-xs font-mono">
                  <thead>
                    <tr className="border-b border-slate-800 text-slate-400 text-[11px] uppercase">
                      <th className="py-2.5 px-2.5">Day</th>
                      <th className="py-2.5 px-2.5">Date</th>
                      <th className="py-2.5 px-2.5">Label</th>
                      <th className="py-2.5 px-2 text-right">Weight</th>
                      <th className="py-2.5 px-2 text-right">kcal</th>
                      <th className="py-2.5 px-2 text-right">vs 1600</th>
                      <th className="py-2.5 px-2 text-right">vs TDEE</th>
                      <th className="py-2.5 px-2 text-right text-sky-400">P (g)</th>
                      <th className="py-2.5 px-2 text-right text-emerald-400">C (g)</th>
                      <th className="py-2.5 px-2 text-right text-rose-400">F (g)</th>
                      <th className="py-2.5 px-2.5">Status</th>
                    </tr>
                  </thead>
                  <tbody className="divide-y divide-slate-800/60">
                    {trailingMetrics.sevenDayArray.map((d) => (
                      <tr
                        key={d.dayIndex}
                        onClick={() => setViewedDayIndex(d.dayIndex)}
                        className={`cursor-pointer transition ${d.isCurrent ? 'bg-emerald-500/15 font-bold' : 'hover:bg-slate-800/50'}`}
                      >
                        <td className="py-2.5 px-2.5 text-emerald-300 underline decoration-dotted whitespace-nowrap">Day {d.dayIndex}</td>
                        <td className="py-2.5 px-2.5 text-slate-400 whitespace-nowrap">{d.dateStr} {d.isWednesday ? '★' : ''}</td>
                        <td className="py-2.5 px-2.5 font-sans text-slate-200 truncate max-w-[200px]">{d.label}</td>
                        <td className="py-2.5 px-2 text-right text-slate-300">{d.weightKg ? `${d.weightKg} kg` : '—'}</td>
                        <td className="py-2.5 px-2 text-right text-amber-300 font-semibold">{d.kcal.toFixed(1)}</td>
                        <td className="py-2.5 px-2 text-right">{d.deltaCeiling >= 0 ? `+${d.deltaCeiling.toFixed(1)}` : d.deltaCeiling.toFixed(1)}</td>
                        <td className="py-2.5 px-2 text-right text-emerald-400 font-semibold">{d.preservedDeficit.toFixed(1)}</td>
                        <td className="py-2.5 px-2 text-right text-sky-300 font-semibold">{d.protein.toFixed(1)}</td>
                        <td className="py-2.5 px-2 text-right text-emerald-300">{d.carbs.toFixed(1)}</td>
                        <td className="py-2.5 px-2 text-right text-rose-300">{d.fat.toFixed(1)}</td>
                        <td className="py-2.5 px-2.5 font-sans whitespace-nowrap">{d.status}</td>
                      </tr>
                    ))}
                  </tbody>
                  <tfoot>
                    <tr className="bg-slate-950 border-t-2 border-slate-700 font-bold text-slate-200">
                      <td colSpan={4} className="py-2.5 px-2.5 text-slate-400 uppercase text-[10px]">
                        7-Day Rolling Avg
                      </td>
                      <td className="py-2.5 px-2 text-right text-amber-300 font-bold">{trailingMetrics.avgKcal.toFixed(1)}</td>
                      <td className="py-2.5 px-2 text-right text-slate-400">
                        {(trailingMetrics.avgKcal - protocolRules.nominalCeiling).toFixed(1)}
                      </td>
                      <td className="py-2.5 px-2 text-right text-emerald-400">{trailingMetrics.avgWeeklyDeficit.toFixed(1)}</td>
                      <td className="py-2.5 px-2 text-right text-sky-300 font-bold">{trailingMetrics.avgProtein.toFixed(1)}</td>
                      <td className="py-2.5 px-2 text-right text-emerald-300 font-bold">{trailingMetrics.avgCarbs.toFixed(1)}</td>
                      <td className="py-2.5 px-2 text-right text-rose-300 font-bold">{trailingMetrics.avgFat.toFixed(1)}</td>
                      <td className="py-2.5 px-2.5 text-[10px] text-slate-400 font-sans font-normal">
                        Compliance: {trailingMetrics.weeklyProteinCompliance}%
                      </td>
                    </tr>
                  </tfoot>
                </table>
              </div>
            )}

            {/* TAB 3: MASTER REFERENCE DB */}
            {activeTab === 'database' && (
              <div className="space-y-4">
                <div className="bg-slate-900 border border-slate-800 rounded-xl p-4 space-y-3">
                  <div className="flex flex-wrap items-center justify-between gap-2">
                    <div>
                      <h3 className="text-xs font-bold uppercase tracking-wider text-white">
                        Consolidated Master Reference Database ({filteredMasterDbView.length} / {masterDb.length} Rows)
                      </h3>
                      <p className="text-[11px] text-slate-400">
                        Filter by category, search by name or Row ID, or click <strong>✎ Edit</strong> to modify macros inline.
                      </p>
                    </div>
                  </div>

                  {/* Category Filter Chips */}
                  <div className="flex gap-1.5 overflow-x-auto pb-1 scrollbar-none">
                    {categories.map(cat => (
                      <button
                        key={cat}
                        type="button"
                        onClick={() => setMasterDbCatFilter(cat)}
                        className={`px-2.5 py-1 rounded-md text-[11px] whitespace-nowrap cursor-pointer transition ${
                          masterDbCatFilter === cat
                            ? 'bg-emerald-500/20 text-emerald-300 border border-emerald-500/40 font-semibold'
                            : 'bg-slate-950 text-slate-400 border border-slate-800 hover:text-white'
                        }`}
                      >
                        {cat}
                      </button>
                    ))}
                  </div>

                  {/* Live Search Input */}
                  <div className="relative">
                    <input
                      type="text"
                      value={masterDbSearch}
                      onChange={(e) => setMasterDbSearch(e.target.value)}
                      placeholder="Search Master DB by food name, Row ID (e.g. HC-01, P-04), or source..."
                      className="w-full bg-slate-950 border border-slate-800 focus:border-emerald-500 rounded-lg px-3 py-2 text-xs text-white placeholder-slate-500 focus:outline-none font-mono"
                    />
                    {masterDbSearch && (
                      <button
                        type="button"
                        onClick={() => setMasterDbSearch('')}
                        className="absolute right-2.5 top-1/2 -translate-y-1/2 text-slate-400 hover:text-white text-xs cursor-pointer font-bold px-1"
                      >
                        ✕
                      </button>
                    )}
                  </div>

                  <div className="overflow-x-auto">
                  <table className="w-full text-left border-collapse text-xs font-mono">
                    <thead>
                      <tr className="border-b border-slate-800 text-slate-400 select-none">
                        {[
                          { key: 'rowId', label: 'Row ID', align: 'text-left' },
                          { key: 'category', label: 'Category', align: 'text-left' },
                          { key: 'name', label: 'Item Name', align: 'text-left' },
                          { key: 'baseUnit', label: 'Base Unit', align: 'text-left' },
                          { key: 'kcal', label: 'kcal', align: 'text-right' },
                          { key: 'protein', label: 'P (g)', align: 'text-right' },
                          { key: 'carbs', label: 'C (g)', align: 'text-right' },
                          { key: 'fat', label: 'F (g)', align: 'text-right' },
                          { key: 'source', label: 'Source', align: 'text-left' }
                        ].map(col => (
                          <th
                            key={col.key}
                            onClick={() => handleSort(col.key)}
                            className={`py-2 px-2 ${col.align} hover:text-emerald-300 cursor-pointer transition`}
                            title={`Sort by ${col.label}`}
                          >
                            <span className="inline-flex items-center gap-1">
                              <span>{col.label}</span>
                              <span className="text-[10px] text-emerald-400">
                                {sortConfig.key === col.key ? (sortConfig.direction === 'asc' ? '▲' : '▼') : '↕'}
                              </span>
                            </span>
                          </th>
                        ))}
                        <th className="py-2 px-2 text-center">Actions</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-slate-800/60">
                      {filteredMasterDbView.map((r) => {
                        const isEditing = editingRowId === r.id;
                        if (isEditing) {
                          return (
                            <tr key={r.id} className="bg-slate-800/60">
                              <td className="py-2 px-1"><input value={editDraft.rowId || ''} onChange={e => setEditDraft({ ...editDraft, rowId: e.target.value })} className="w-16 bg-slate-950 border border-slate-700 rounded px-1.5 py-1 text-xs text-emerald-300" /></td>
                              <td className="py-2 px-1">
                                <select
                                  value={editDraft.category || ''}
                                  onChange={e => {
                                    if (e.target.value === '__new__') {
                                      const nCat = prompt('Enter new category name:');
                                      if (nCat && nCat.trim()) setEditDraft({ ...editDraft, category: nCat.trim() });
                                    } else {
                                      setEditDraft({ ...editDraft, category: e.target.value });
                                    }
                                  }}
                                  className="w-32 bg-slate-950 border border-slate-700 rounded px-1.5 py-1 text-xs text-white"
                                >
                                  {categories.filter(c => c !== 'All').map(c => <option key={c} value={c}>{c}</option>)}
                                  <option value="__new__">+ Create New Category...</option>
                                </select>
                              </td>
                              <td className="py-2 px-1"><input value={editDraft.name || ''} onChange={e => setEditDraft({ ...editDraft, name: e.target.value })} className="w-40 bg-slate-950 border border-slate-700 rounded px-1.5 py-1 text-xs text-white" /></td>
                              <td className="py-2 px-1"><input value={editDraft.baseUnit || ''} onChange={e => setEditDraft({ ...editDraft, baseUnit: e.target.value })} className="w-20 bg-slate-950 border border-slate-700 rounded px-1.5 py-1 text-xs text-emerald-300" /></td>
                              <td className="py-2 px-1"><input type="number" step="0.1" value={editDraft.kcal} onChange={e => setEditDraft({ ...editDraft, kcal: e.target.value })} className="w-16 bg-slate-950 border border-slate-700 rounded px-1.5 py-1 text-xs text-right text-amber-300" /></td>
                              <td className="py-2 px-1"><input type="number" step="0.1" value={editDraft.protein} onChange={e => setEditDraft({ ...editDraft, protein: e.target.value })} className="w-14 bg-slate-950 border border-slate-700 rounded px-1.5 py-1 text-xs text-right text-sky-300" /></td>
                              <td className="py-2 px-1"><input type="number" step="0.1" value={editDraft.carbs} onChange={e => setEditDraft({ ...editDraft, carbs: e.target.value })} className="w-14 bg-slate-950 border border-slate-700 rounded px-1.5 py-1 text-xs text-right text-emerald-300" /></td>
                              <td className="py-2 px-1"><input type="number" step="0.1" value={editDraft.fat} onChange={e => setEditDraft({ ...editDraft, fat: e.target.value })} className="w-14 bg-slate-950 border border-slate-700 rounded px-1.5 py-1 text-xs text-right text-rose-300" /></td>
                              <td className="py-2 px-1"><input value={editDraft.source || ''} onChange={e => setEditDraft({ ...editDraft, source: e.target.value })} className="w-32 bg-slate-950 border border-slate-700 rounded px-1.5 py-1 text-xs text-slate-300" /></td>
                              <td className="py-2 px-1 text-center whitespace-nowrap space-x-1">
                                <button onClick={handleCalc449InEditDraft} className="px-1.5 py-0.5 rounded bg-sky-500/20 text-sky-300 text-[10px]" title="Calculate kcal via 4-4-9">4-4-9</button>
                                <button onClick={handleSaveEditRow} className="px-2 py-0.5 rounded bg-emerald-600 text-white text-[11px]">✓</button>
                                <button onClick={() => setEditingRowId(null)} className="px-1.5 py-0.5 rounded bg-slate-700 text-slate-300 text-[11px]">✕</button>
                              </td>
                            </tr>
                          );
                        }
                        return (
                          <tr key={r.id} className="hover:bg-slate-800/30">
                            <td className="py-2 px-2 text-emerald-400 font-bold whitespace-nowrap">{r.rowId}</td>
                            <td className="py-2 px-2 font-sans text-slate-400 text-[11px]">{r.category}</td>
                            <td className="py-2 px-2 font-sans text-white font-medium">{r.name}</td>
                            <td className="py-2 px-2 text-emerald-300">{r.baseUnit}</td>
                            <td className="py-2 px-2 text-right text-amber-300 font-semibold">{Number(r.kcal || 0).toFixed(1)}</td>
                            <td className="py-2 px-2 text-right text-sky-300">{Number(r.protein || 0).toFixed(1)}</td>
                            <td className="py-2 px-2 text-right text-emerald-300">{Number(r.carbs || 0).toFixed(1)}</td>
                            <td className="py-2 px-2 text-right text-rose-300">{Number(r.fat || 0).toFixed(1)}</td>
                            <td className="py-2 px-2 font-sans text-slate-400 text-[11px]">{r.source}</td>
                            <td className="py-2 px-2 text-center whitespace-nowrap space-x-1">
                              <button
                                onClick={() => handleStartEditRow(r)}
                                className="px-2 py-0.5 rounded bg-sky-500/15 hover:bg-sky-500/30 text-sky-300 border border-sky-500/30 text-[11px] cursor-pointer"
                              >
                                ✎ Edit
                              </button>
                              <button
                                onClick={() => handleDeleteMasterDbRow(r)}
                                className="px-2 py-0.5 rounded bg-rose-500/15 hover:bg-rose-500/30 text-rose-300 border border-rose-500/30 text-[11px] cursor-pointer"
                              >
                                🗑
                              </button>
                            </td>
                          </tr>
                        );
                      })}
                    </tbody>
                  </table>
                </div>
              </div>
	</div>
            )}

            {/* TAB 4: MARKDOWN OUTPUT */}
            {activeTab === 'export' && (
              <div className="bg-slate-900 border border-slate-800 rounded-xl p-4 space-y-3">
                <div className="flex justify-between items-center pb-1">
                  <span className="text-xs text-slate-400 font-mono">You can highlight and copy any section individually:</span>
                  <button
                    type="button"
                    onClick={() => {
                      navigator.clipboard.writeText(protocolMarkdownReport);
                      alert('Full Markdown Report copied to clipboard!');
                    }}
                    className="px-2.5 py-1 rounded bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-semibold cursor-pointer"
                  >
                    Copy Full Report
                  </button>
                </div>
                <pre className="w-full bg-slate-950 border border-slate-800 rounded-lg p-3 text-xs font-mono text-slate-200 overflow-x-auto whitespace-pre-wrap select-text">
                  {protocolMarkdownReport}
                </pre>
              </div>
            )}

            {/* BOTTOM DANGER ZONE */}
            <div className="mt-8 border border-rose-950/40 bg-rose-950/10 rounded-xl p-4">
              <details className="text-xs">
                <summary className="font-bold text-rose-400 cursor-pointer select-none">
                  ⚠️ Danger Zone: Day Management & Reset
                </summary>
                <div className="mt-3 flex items-center justify-between pt-2 border-t border-rose-950/30">
                  <span className="text-slate-400 text-xs">Permanently remove Day {viewedDayIndex} data</span>
                  <button
                    onClick={() => {
                      if (confirm(`Permanently delete Day ${viewedDayIndex} and return to Day ${viewedDayIndex - 1}?`)) {
                        setDaysArchive(prev => { const c = { ...prev }; delete c[viewedDayIndex]; return c; });
                        setViewedDayIndex(viewedDayIndex - 1);
                      }
                    }}
                    className="px-3 py-1 bg-rose-600/30 text-rose-300 border border-rose-500/40 rounded text-xs font-mono hover:bg-rose-600/50 cursor-pointer"
                  >
                    🗑 Delete Day {viewedDayIndex}
                  </button>
                </div>
              </details>
            </div>
          </main>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
